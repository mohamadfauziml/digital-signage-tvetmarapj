<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <title>TVETMARA Digital Signage</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="signage">
    <header class="header">
      <div class="brand">
        <img src="assets/logo.png" alt="Logo Kolej" class="logo" onerror="this.style.display='none'">
        <div class="brand-text">
          <div class="college-name">TVETMARA PETALING JAYA</div>
          <div class="tagline">Digital Information Display</div>
        </div>
      </div>

      <div class="clock-box">
        <div id="clock">--:--</div>
        <div id="date">Loading...</div>
      </div>
    </header>

    <section class="poster-frame">
      <img id="poster" alt="Poster Aktiviti" />
      <div id="fallback" class="fallback">
        <div class="fallback-title">Tiada pengumuman aktif buat masa ini</div>
        <div class="fallback-subtitle">Sila semak semula kemudian.</div>
      </div>

      <div class="poster-counter" id="posterCounter"></div>
    </section>

    <footer class="footer">
      <div class="footer-label">INFO KOLEJ</div>
      <div class="ticker-wrap">
        <div class="ticker">
          Selamat datang ke TVETMARA Petaling Jaya • Maklumat aktiviti dan pengumuman terkini dipaparkan di sini •
        </div>
      </div>
    </footer>
  </main>

  <script src="script.js"></script>
</body>
</html>
