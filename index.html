<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />

  <title>TVETMARA Petaling Jaya Digital Signage</title>

  <link rel="stylesheet" href="style.css" />
</head>

<body>

  <main class="signage">

    <!-- =====================================================
         HEADER
         ===================================================== -->

    <header class="header">

      <!-- LEFT: CAMPUS BUILDING -->
      <div class="building-zone">

        <img
          src="assets/TVETMARAPJBuilding.png?v=2"
          alt="TVETMARA Petaling Jaya"
          class="building-image"
          onerror="this.style.display='none'"
        >

      </div>


      <!-- CENTER: OFFICIAL LOGOS -->
      <div class="logo-group">

        <img
          src="assets/MARA.png?v=2"
          alt="Logo MARA"
          class="header-logo mara-logo"
          onerror="this.style.display='none'"
        >

        <div class="logo-divider"></div>

        <img
          src="assets/JATANEGARA.png?v=2"
          alt="Jata Negara"
          class="header-logo jata-logo"
          onerror="this.style.display='none'"
        >

        <div class="logo-divider"></div>

        <img
          src="assets/TVETMARAPJ.png?v=2"
          alt="Logo TVETMARA Petaling Jaya"
          class="header-logo tvet-logo"
          onerror="this.style.display='none'"
        >

      </div>


      <!-- RIGHT: CLOCK -->
      <div class="clock-box">

        <div id="clock">
          --:--:--
        </div>

        <div id="date">
          Memuatkan...
        </div>

      </div>

    </header>


    <!-- =====================================================
         POSTER AREA
         ===================================================== -->

    <section class="poster-frame">

      <!-- Blurred poster background -->
      <div
        id="posterBackground"
        class="poster-background">
      </div>


      <!-- Soft overlay -->
      <div class="poster-overlay"></div>


      <!-- Main poster -->
      <img
        id="poster"
        class="poster"
        alt="Poster Aktiviti"
      >


      <!-- Fallback -->
      <div
        id="fallback"
        class="fallback">

        <div class="fallback-title">
          Tiada pengumuman aktif buat masa ini
        </div>

        <div class="fallback-subtitle">
          Sila semak semula kemudian.
        </div>

      </div>


      <!-- Poster Counter -->
      <div
        id="posterCounter"
        class="poster-counter">
      </div>

    </section>


    <!-- =====================================================
         FOOTER / TICKER
         ===================================================== -->

    <footer class="footer">

      <div class="footer-label">
        TERKINI
      </div>

      <div class="ticker-wrap">

        <div
          id="ticker"
          class="ticker">

          Memuatkan maklumat terkini...

        </div>

      </div>

    </footer>

  </main>


  <script src="script.js"></script>

</body>
</html>
